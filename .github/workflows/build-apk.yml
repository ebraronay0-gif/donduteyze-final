name: Döndü Teyze APK Oluştur

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    name: Android APK Derleme
    runs-on: ubuntu-latest

    steps:

      - name: Depoyu indir
        uses: actions/checkout@v4

      - name: Java 17 kur
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK kur
        uses: android-actions/setup-android@v3

      - name: Android SDK paketlerini kur
        run: |
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: ZIP dosyasını kontrol et
        run: |
          echo "ZIP dosyaları kontrol ediliyor..."
          ls -lah

          if [ -f "donduteyze-v53-icon-final.zip" ]; then
            echo "ZIP bulundu:"
            ls -lh "donduteyze-v53-icon-final.zip"
          else
            echo "HATA: donduteyze-v53-icon-final.zip bulunamadı."
            echo "Mevcut ZIP dosyaları:"
            find . -maxdepth 2 -type f -name "*.zip" -print
            exit 1
          fi

      - name: ZIP dosyasını aç
        run: |
          rm -rf android-project
          mkdir -p android-project

          unzip -q "donduteyze-v53-icon-final.zip" -d android-project

          echo "ZIP açıldı."
          echo "İçerik:"
          find android-project -maxdepth 3 -type f | head -100

      - name: Android projesini bul
        run: |
          echo "Android projesi aranıyor..."

          PROJECT_DIR=""

          if [ -f "android-project/gradlew" ]; then
            PROJECT_DIR="android-project"
          else
            PROJECT_DIR=$(find android-project -type f -name "gradlew" -print -quit | xargs -r dirname)
          fi

          if [ -z "$PROJECT_DIR" ]; then
            echo "HATA: gradlew bulunamadı."
            echo "ZIP içeriği:"
            find android-project -maxdepth 5 -type f -print
            exit 1
          fi

          echo "Android projesi bulundu:"
          echo "$PROJECT_DIR"

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Gradle Wrapper kontrol
        run: |
          cd "$PROJECT_DIR"

          if [ ! -f "gradlew" ]; then
            echo "HATA: gradlew bulunamadı."
            exit 1
          fi

          chmod +x gradlew

          echo "Gradle Wrapper bulundu."
          ./gradlew --version

      - name: APK oluştur
        run: |
          cd "$PROJECT_DIR"

          chmod +x gradlew

          echo "APK derlemesi başlıyor..."

          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: APK dosyasını bul
        run: |
          echo "APK dosyaları aranıyor..."

          find "$PROJECT_DIR" -type f -name "*.apk" -print

          APK=$(find "$PROJECT_DIR" -type f -name "*.apk" -print -quit)

          if [ -z "$APK" ]; then
            echo "HATA: APK oluşturulamadı."
            exit 1
          fi

          echo "APK bulundu:"
          echo "$APK"

          echo "APK_PATH=$APK" >> "$GITHUB_ENV"

      - name: APK'yi yükle
        uses: actions/upload-artifact@v4
        with:
          name: donduteyze-apk
          path: ${{ env.APK_PATH }}
          if-no-files-found: error

      - name: İşlem tamamlandı
        run: |
          echo "===================================="
          echo "DÖNDÜ TEYZE APK BAŞARIYLA OLUŞTURULDU"
          echo "===================================="
      - name: APK'yi yükle
        uses: actions/upload-artifact@v4
        with:
          name: donduteyze-apk
          path: ${{ env.APK_PATH }}
          if-no-files-found: error

      - name: İşlem tamamlandı
        run: |
          echo "===================================="
          echo "DÖNDÜ TEYZE APK BAŞARIYLA OLUŞTURULDU"
          echo "===================================="
