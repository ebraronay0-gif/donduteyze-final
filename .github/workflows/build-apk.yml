name: Döndü Teyze APK Oluştur

on:
  push:
    branches:
      - ana
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Android APK Build
    runs-on: ubuntu-latest

    steps:

      # 1. Depoyu indir
      - name: Depoyu indir
        uses: actions/checkout@v4

      # 2. Java 17 kur
      - name: Java 17 kur
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      # 3. Android SDK kur
      - name: Android SDK kur
        uses: android-actions/setup-android@v4
        with:
          packages: |
            platform-tools
            platforms;android-35
            build-tools;35.0.0

      # 4. ZIP dosyasını bul
      - name: ZIP dosyasını bul
        shell: bash
        run: |
          set -e

          echo "=== ZIP DOSYALARI ==="
          find . -type f -iname "*.zip" -print

          ZIP_FILE=$(find . -type f -iname "*.zip" | head -n 1)

          if [ -z "$ZIP_FILE" ]; then
            echo "HATA: ZIP dosyası bulunamadı!"
            exit 1
          fi

          echo "Bulunan ZIP: $ZIP_FILE"

          mkdir -p extracted

          unzip -o "$ZIP_FILE" -d extracted

          echo "=== ZIP İÇERİĞİ ==="
          find extracted -maxdepth 4 -type f | head -n 300

      # 5. Gradle projesini bul
      - name: Gradle projesini bul
        shell: bash
        run: |
          set -e

          echo "=== GRADLE DOSYALARI ARANIYOR ==="

          GRADLEW=$(find extracted -type f -name "gradlew" | head -n 1)

          if [ -z "$GRADLEW" ]; then
            echo "gradlew bulunamadı."

            echo "=== build.gradle DOSYALARI ==="
            find extracted -type f \( \
              -name "build.gradle" \
              -o -name "build.gradle.kts" \
              \) -print

            echo ""
            echo "=== settings.gradle DOSYALARI ==="
            find extracted -type f \( \
              -name "settings.gradle" \
              -o -name "settings.gradle.kts" \
              \) -print

            echo ""
            echo "=== TÜM DOSYALAR ==="
            find extracted -maxdepth 5 -type f | head -n 500

            exit 1
          fi

          PROJECT_DIR=$(dirname "$GRADLEW")

          echo "Gradle projesi bulundu:"
          echo "$PROJECT_DIR"

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      # 6. Gradle wrapper çalıştırma izni
      - name: Gradle wrapper hazırla
        shell: bash
        run: |
          set -e

          chmod +x "$PROJECT_DIR/gradlew"

          echo "Gradle sürümü:"
          cd "$PROJECT_DIR"
          ./gradlew --version

      # 7. APK oluştur
      - name: APK oluştur
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          echo "=== APK BUILD BAŞLIYOR ==="

          ./gradlew assembleDebug --no-daemon --stacktrace

      # 8. APK dosyasını kontrol et
      - name: APK dosyasını kontrol et
        shell: bash
        run: |
          set -e

          echo "=== APK DOSYALARI ==="

          find "$PROJECT_DIR" -type f -iname "*.apk" -print

          APK_COUNT=$(find "$PROJECT_DIR" -type f -iname "*.apk" | wc -l)

          if [ "$APK_COUNT" -eq 0 ]; then
            echo "HATA: APK oluşturulamadı!"
            exit 1
          fi

          echo "APK başarıyla oluşturuldu."

      # 9. APK'yı GitHub'a yükle
      - name: APK'yı yükle
        uses: actions/upload-artifact@v4
        with:
          name: donduteyze-apk
          path: |
            **/*.apk
          if-no-files-found: error
          retention-days: 30
