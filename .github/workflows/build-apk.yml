name: Dondu Teyze APK Olustur

on:
  workflow_dispatch:

  push:
    branches:
      - main

permissions:
  contents: read

jobs:

  build:
    name: Android APK Derlemesi
    runs-on: ubuntu-latest

    steps:

      # --------------------------------------------------
      # 1 - DEPoyu indir
      # --------------------------------------------------

      - name: Depoyu indir
        uses: actions/checkout@v4


      # --------------------------------------------------
      # 2 - JAVA 17
      # --------------------------------------------------

      - name: Java 17 kur
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'


      # --------------------------------------------------
      # 3 - ANDROID SDK
      # --------------------------------------------------

      - name: Android SDK kur
        uses: android-actions/setup-android@v3


      # --------------------------------------------------
      # 4 - ANDROID SDK ARACLARI
      # --------------------------------------------------

      - name: Android SDK araclarini hazirla
        shell: bash
        run: |
          yes | sdkmanager --licenses || true

          sdkmanager \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"


      # --------------------------------------------------
      # 5 - ZIP DOSYASINI BUL
      # --------------------------------------------------

      - name: ZIP dosyasini bul
        id: zip
        shell: bash
        run: |
          echo "======================================"
          echo "ZIP DOSYALARI ARANIYOR"
          echo "======================================"

          find . -type f -iname "*.zip" -print

          ZIP_FILE=$(find . -type f -iname "*.zip" | head -n 1)

          if [ -z "$ZIP_FILE" ]; then
            echo ""
            echo "HATA: ZIP DOSYASI BULUNAMADI"
            echo ""
            echo "Depodaki dosyalar:"
            find . -maxdepth 4 -type f -print | head -200
