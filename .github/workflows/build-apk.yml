name: Döndü Teyze APK Oluştur

on:
  workflow_dispatch:
  push:
    branches:
      - ana

jobs:
  build:
    name: Android APK Build
    runs-on: ubuntu-latest

    steps:

      - name: Depoyu indir
        uses: actions/checkout@v4

      - name: Java 17 kur
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK kur
        uses: android-actions/setup-android@v3

      - name: Android SDK araçlarını hazırla
        run: |
          sdkmanager "platform-tools"
          sdkmanager "platforms;android-35"
          sdkmanager "build-tools;35.0.0"

      - name: ZIP dosyasını bul
        id: zip
        shell: bash
        run: |
          echo "ZIP dosyaları aranıyor..."

          ZIP_FILE=$(find . -type f -iname "*.zip" | head -n 1)

          if [ -z "$ZIP_FILE" ]; then
            echo "HATA: ZIP dosyası bulunamadı."
            echo "Depodaki dosyalar:"
            find . -maxdepth 3 -type f | head -100
            exit 1
          fi

          echo "ZIP bulundu: $ZIP_FILE"
          echo "zip_file=$ZIP_FILE" >> "$GITHUB_OUTPUT"

      - name: ZIP dosyasını aç
        run: |
          rm -rf extracted
          mkdir -p extracted

          unzip -q "${{ steps.zip.outputs.zip_file }}" -d extracted

          echo "ZIP içeriği:"
          find extracted -maxdepth 3 -type f | head -200

      - name: Gradle projesini bul
        id: gradle
        shell: bash
        run: |
          echo "Gradle projesi aranıyor..."

          GRADLEW=$(find extracted -type f -name "gradlew" | head -n 1)

          if [ -z "$GRADLEW" ]; then
            echo "HATA: gradlew bulunamadı."

            echo "Bulunan önemli dosyalar:"
            find extracted -type f \( \
              -name "build.gradle" -o \
              -name "build.gradle.kts" -o \
              -name "settings.gradle" -o \
              -name "settings.gradle.kts" \
            \) -print

            exit 1
          fi

          PROJECT_DIR=$(dirname "$GRADLEW")

          echo "Gradle wrapper bulundu:"
          echo "$GRADLEW"

          echo "Gradle proje klasörü:"
          echo "$PROJECT_DIR"

          echo "project_dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"

      - name: Gradle izinlerini ver
        run: |
          chmod +x "${{ steps.gradle.outputs.project_dir }}/gradlew"

      - name: APK oluştur
        working-directory: ${{ steps.gradle.outputs.project_dir }}
        run: |
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: APK dosyasını kontrol et
        run: |
          echo "APK dosyaları:"

          find extracted -type f -name "*.apk" -print

          APK_COUNT=$(find extracted -type f -name "*.apk" | wc -l)

          if [ "$APK_COUNT" -eq 0 ]; then
            echo "HATA: APK oluşturulamadı."
            exit 1
          fi

      - name: APK'yı yükle
        uses: actions/upload-artifact@v4
        with:
          name: dondu-teyze-apk
          path: extracted/**/*.apk
          if-no-files-found: error
