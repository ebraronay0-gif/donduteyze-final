name: Dondu Teyze APK Olustur

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Android APK Derlemesi
    runs-on: ubuntu-latest

    steps:

      - name: Depoyu indir
        uses: actions/checkout@v6

      - name: Java 17 kur
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK kur
        uses: android-actions/setup-android@v4

      - name: Android SDK paketlerini kur
        shell: bash
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager "platform-tools"
          sdkmanager "platforms;android-35"
          sdkmanager "build-tools;35.0.0"

      - name: ZIP dosyasini bul
        id: zip
        shell: bash
        run: |
          echo "ZIP dosyalari araniyor..."

          ZIP_FILE=$(find . \
            -type f \
            -iname "*.zip" \
            -not -path "./.git/*" \
            | head -n 1)

          if [ -z "$ZIP_FILE" ]; then
            echo "HATA: ZIP dosyasi bulunamadi."
            echo "Depodaki dosyalar:"
            find . -maxdepth 5 -type f | head -200
            exit 1
          fi

          echo "ZIP bulundu: $ZIP_FILE"
          echo "zip_file=$ZIP_FILE" >> "$GITHUB_OUTPUT"

      - name: ZIP dosyasini ac
        shell: bash
        run: |
          rm -rf extracted
          mkdir -p extracted

          unzip -o "${{ steps.zip.outputs.zip_file }}" -d extracted

          echo "ZIP icerigi:"
          find extracted -maxdepth 6 -type f | head -300

      - name: Android projesini bul
        id: project
        shell: bash
        run: |
          echo "Android projesi araniyor..."

          PROJECT_DIR=""

          GRADLEW=$(find extracted \
            -type f \
            -name "gradlew" \
            -not -path "*/.git/*" \
            | head -n 1)

          if [ -n "$GRADLEW" ]; then
            PROJECT_DIR=$(dirname "$GRADLEW")
            echo "gradlew bulundu: $GRADLEW"
          fi

          if [ -z "$PROJECT_DIR" ]; then
            SETTINGS=$(find extracted \
              -type f \
              \
                -name "settings.gradle" \
                -o \
                -name "settings.gradle.kts" \
              \
              -not -path "*/.git/*" \
              | head -n 1)

            if [ -n "$SETTINGS" ]; then
              PROJECT_DIR=$(dirname "$SETTINGS")
              echo "settings bulundu: $SETTINGS"
            fi
          fi

          if [ -z "$PROJECT_DIR" ]; then
            BUILD_FILE=$(find extracted \
              -type f \
              \
                -name "build.gradle" \
                -o \
                -name "build.gradle.kts" \
              \
              -not -path "*/.git/*" \
              | head -n 1)

            if [ -n "$BUILD_FILE" ]; then
              PROJECT_DIR=$(dirname "$BUILD_FILE")
              echo "build dosyasi bulundu: $BUILD_FILE"
            fi
          fi

          if [ -z "$PROJECT_DIR" ]; then
            echo "HATA: Android Gradle projesi bulunamadi."
            echo ""
            echo "Bulunan Gradle dosyalari:"
            find extracted -type f \
              \
                -name "gradlew" \
                -o \
                -name "settings.gradle" \
                -o \
                -name "settings.gradle.kts" \
                -o \
                -name "build.gradle" \
                -o \
                -name "build.gradle.kts" \
              \
              -print

            echo ""
            echo "ZIP icerigi:"
            find extracted -maxdepth 6 -type f | head -300

            exit 1
          fi

          echo "PROJE KLASORU: $PROJECT_DIR"
          echo "project_dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"

      - name: Gradle Wrapper kontrol
        working-directory: ${{ steps.project.outputs.project_dir }}
        shell: bash
        run: |
          echo "Proje klasoru:"
          pwd

          echo "Dosyalar:"
          find . -maxdepth 3 -type f | head -200

          if [ ! -f "./gradlew" ]; then
            echo "HATA: gradlew bulunamadi."
            exit 1
          fi

          chmod +x ./gradlew

      - name: APK olustur
        working-directory: ${{ steps.project.outputs.project_dir }}
        shell: bash
        run: |
          echo "APK derlemesi basliyor..."

          ./gradlew assembleDebug \
            --no-daemon \
            --stacktrace \
            --warning-mode all

      - name: APK dosyasini bul
        id: apk
        shell: bash
        run: |
          echo "APK dosyalari araniyor..."

          APK=$(find extracted \
            -type f \
            -name "*.apk" \
            | head -n 1)

          if [ -z "$APK" ]; then
            echo "HATA: APK olusturulamadi."
            echo ""
            echo "Bulunan dosyalar:"
