name: Dondu Teyze APK Olustur

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    name: Android APK Derlemesi
    runs-on: ubuntu-latest

    steps:

      - name: Depoyu indir
        uses: actions/checkout@v4

      - name: Java 17 kur
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK kur
        uses: android-actions/setup-android@v3

      - name: Android SDK paketlerini kur
        run: |
          sdkmanager "platform-tools"
          sdkmanager "platforms;android-35"
          sdkmanager "build-tools;35.0.0"

      - name: ZIP dosyasini kontrol et
        run: |
          echo "ZIP kontrol ediliyor..."

          if [ ! -f "dondu teyze-v53-icon-final.zip" ]; then
            echo "HATA: dondu teyze-v53-icon-final.zip bulunamadi!"
            echo "Depodaki dosyalar:"
            ls -lah
            exit 1
          fi

          echo "ZIP bulundu:"
          ls -lh "dondu teyze-v53-icon-final.zip"

      - name: ZIP dosyasini ac
        run: |
          rm -rf extracted
          mkdir -p extracted

          unzip -q "dondu teyze-v53-icon-final.zip" -d extracted

          echo "ZIP basariyla acildi."
          echo "Icerik:"
          find extracted -maxdepth 4 -type f | head -200

      - name: Android projesini bul
        id: project
        shell: bash
        run: |
          echo "Android projesi araniyor..."

          GRADLEW=$(find extracted -type f -name "gradlew" -print -quit)

          if [ -z "$GRADLEW" ]; then
            echo "HATA: gradlew bulunamadi."
            echo ""
            echo "Bulunan Gradle dosyalari:"
            find extracted -type f \( \
              -name "build.gradle" -o \
              -name "build.gradle.kts" -o \
              -name "settings.gradle" -o \
              -name "settings.gradle.kts" \
            \) -print

            echo ""
            echo "Ilk 300 dosya:"
            find extracted -type f -print | head -300

            exit 1
          fi

          PROJECT_DIR=$(dirname "$GRADLEW")

          echo "Gradle wrapper bulundu:"
          echo "$GRADLEW"

          echo "Android proje klasoru:"
          echo "$PROJECT_DIR"

          echo "project_dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"

      - name: Gradle Wrapper kontrol
        working-directory: ${{ steps.project.outputs.project_dir }}
        run: |
          echo "Gradle Wrapper kontrol ediliyor..."
          ls -lah
          chmod +x gradlew
          ./gradlew --version

      - name: APK olustur
        working-directory: ${{ steps.project.outputs.project_dir }}
        run: |
          echo "APK derlemesi basliyor..."
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: APK dosyasini bul
        run: |
          echo "Olusturulan APK dosyalari:"

          find extracted -type f -name "*.apk" -print

          APK=$(find extracted -type f -name "*.apk" -print -quit)

          if [ -z "$APK" ]; then
            echo "HATA: APK bulunamadi!"
            exit 1
          fi

          echo "APK bulundu:"
          echo "$APK"

          mkdir -p apk-output
          cp "$APK" "apk-output/dondu-teyze-debug.apk"

          echo "APK hazir:"
          ls -lh apk-output/dondu-teyze-debug.apk

      - name: APK'yi yukle
        uses: actions/upload-artifact@v4
        with:
          name: dondu-teyze-apk
          path: apk-output/dondu-teyze-debug.apk
          if-no-files-found: error
