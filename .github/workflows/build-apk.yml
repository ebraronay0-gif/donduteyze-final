name: Dondu Teyze APK Olustur

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    name: Android APK Derlemesi
    runs-on: ubuntu-latest

    steps:

      # 1 - Depoyu indir
      - name: Depoyu indir
        uses: actions/checkout@v4

      # 2 - Java 17
      - name: Java 17 kur
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # 3 - Android SDK
      - name: Android SDK kur
        uses: android-actions/setup-android@v3

      # 4 - Android SDK paketleri
      - name: Android SDK paketlerini kur
        shell: bash
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager "platform-tools"
          sdkmanager "platforms;android-35"
          sdkmanager "build-tools;35.0.0"

      # 5 - ZIP dosyasini bul
      - name: ZIP dosyasini bul
        id: zip
        shell: bash
        run: |
          echo "======================================"
          echo "ZIP DOSYALARI ARANIYOR"
          echo "======================================"

          ZIP_FILE=$(find . -type f -iname "*.zip" \
            -not -path "./.git/*" \
            | head -n 1)

          if [ -z "$ZIP_FILE" ]; then
            echo "HATA: ZIP dosyasi bulunamadi."
            echo ""
            echo "Depodaki dosyalar:"
            find . -maxdepth 4 -type f | head -200
            exit 1
          fi

          echo "ZIP bulundu:"
          echo "$ZIP_FILE"

          echo "zip_file=$ZIP_FILE" >> "$GITHUB_OUTPUT"

      # 6 - ZIP'i ac
      - name: ZIP dosyasini ac
        shell: bash
        run: |
          echo "======================================"
          echo "ZIP ACILIYOR"
          echo "======================================"

          rm -rf extracted
          mkdir -p extracted

          unzip -o "${{ steps.zip.outputs.zip_file }}" -d extracted

          echo ""
          echo "ZIP ICERIGI:"
          find extracted -maxdepth 5 -type f | head -300

      # 7 - Android / Gradle projesini otomatik bul
      - name: Gradle projesini bul
        id: gradle
        shell: bash
        run: |
          echo "======================================"
          echo "ANDROID / GRADLE PROJESI ARANIYOR"
          echo "======================================"

          PROJECT_DIR=""

          # Once gradlew ara
          GRADLEW=$(find extracted \
            -type f \
            -name "gradlew" \
            -not -path "*/.git/*" \
            | head -n 1)

          if [ -n "$GRADLEW" ]; then
            PROJECT_DIR=$(dirname "$GRADLEW")
            echo "gradlew bulundu:"
            echo "$GRADLEW"
          fi

          # gradlew yoksa settings.gradle ara
          if [ -z "$PROJECT_DIR" ]; then
            SETTINGS=$(find extracted \
              -type f \
              \( \
                -name "settings.gradle" \
                -o \
                -name "settings.gradle.kts" \
              \) \
              -not -path "*/.git/*" \
              | head -n 1)

            if [ -n "$SETTINGS" ]; then
              PROJECT_DIR=$(dirname "$SETTINGS")
              echo "settings.gradle bulundu:"
              echo "$SETTINGS"
            fi
          fi

          # settings yoksa build.gradle ara
          if [ -z "$PROJECT_DIR" ]; then
            BUILD_FILE=$(find extracted \
              -type f \
              \( \
                -name "build.gradle" \
                -o \
                -name "build.gradle.kts" \
              \) \
              -not -path "*/.git/*" \
              | head -n 1)

            if [ -n "$BUILD_FILE" ]; then
              PROJECT_DIR=$(dirname "$BUILD_FILE")
              echo "build.gradle bulundu:"
              echo "$BUILD_FILE"
            fi
          fi

          # Hicbir sey bulunamadiysa hata ver
          if [ -z "$PROJECT_DIR" ]; then
            echo ""
            echo "======================================"
            echo "HATA: ANDROID / GRADLE PROJESI BULUNAMADI"
            echo "======================================"
            echo ""
            echo "ZIP ICINDE BULUNAN ONEMLI DOSYALAR:"
            
            find extracted -type f \
              \( \
                -name "*.gradle" \
                -o \
                -name "*.gradle.kts" \
                -o \
                -name "gradlew" \
                -o \
                -name "AndroidManifest.xml" \
                -o \
                -name "package.json" \
              \) \
              -print | head -200

            echo ""
            echo "ZIP ICERIGININ ILK 300 DOSYASI:"
            find extracted -maxdepth 6 -type f | head -300

            exit 1
          fi

          echo ""
          echo "======================================"
          echo "PROJE KLASORU BULUNDU"
          echo "======================================"
          echo "$PROJECT_DIR"

          echo "project_dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"

      # 8 - Proje klasorunu kontrol et
      - name: Gradle projesini kontrol et
        working-directory: ${{ steps.gradle.outputs.project_dir }}
        shell: bash
        run: |
          echo "======================================"
          echo "PROJE DOSYALARI"
          echo "======================================"

          pwd

          echo ""
          echo "Dosyalar:"
          find . -maxdepth 3 -type f | head -200

          echo ""
          echo "Gradle dosyalari:"
          find . -type f \
            \( \
              -name "gradlew" \
              -o \
              -name "settings.gradle" \
              -o \
              -name "settings.gradle.kts" \
              -o \
              -name "build.gradle" \
              -o \
              -name "build.gradle.kts" \
            \) \
            -print

      # 9 - Gradle Wrapper varsa onu kullan
      - name: Gradle ile APK olustur
        working-directory: ${{ steps.gradle.outputs.project_dir }}
        shell: bash
        run: |
          echo "======================================"
          echo "APK DERLEMESI BASLIYOR"
          echo "======================================"

          if [ -f "./gradlew" ]; then
            chmod +x ./gradlew

            echo "Gradle Wrapper bulundu."
            ./gradlew assembleDebug \
              --no-daemon \
              --stacktrace
          else
            echo "HATA: gradlew bulunamadi."
            echo "Android projesinin Gradle Wrapper icermesi gerekiyor."
            exit 1
          fi

      # 10 - APK bul
      - name: APK dosyasini bul
        id: apk
        shell: bash
        run: |
          echo "======================================"
          echo "APK ARANIYOR"
          echo "======================================"

          APK=$(find extracted \
            -type f \
            -name "*.apk" \
            | head -n 1)

          if [ -z "$APK" ]; then
            echo "HATA: APK bulunamadi."
            echo ""
            echo "Bulunan dosyalar:"
            find extracted -type f | tail -100
            exit 1
          fi

          echo ""
          echo "APK BULUNDU:"
          echo "$APK"

          echo "apk_file=$APK" >> "$GITHUB_OUTPUT"

      # 11 - APK'yi artifact olarak yukle
      - name: APK yi yukle
        uses: actions/upload-artifact@v4
        with:
          name: dondu-teyze-apk
          path: ${{ steps.apk.outputs.apk_file }}
          if-no-files-found: error

      # 12 - Sonuc
      - name: Derleme tamamlandi
        shell: bash
        run: |
          echo "======================================"
          echo "DONDU TEYZE APK HAZIR"
          echo "======================================"
          echo ""
          echo "APK basariyla olusturuldu ve yuklendi."
