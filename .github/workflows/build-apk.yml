name: Döndü Teyze APK Oluştur

on:
  push:
    branches:
      - ana
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Android APK Build
    runs-on: ubuntu-latest

    steps:

      - name: Depoyu indir
        uses: actions/checkout@v4

      - name: Java 17 kur
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK kur
        uses: android-actions/setup-android@v4
        with:
          packages: |
            platform-tools
            platforms;android-35
            build-tools;35.0.0

      - name: ZIP dosyasını bul ve aç
        shell: bash
        run: |
          set -e

          echo "================================"
          echo "ZIP DOSYASI ARANIYOR"
          echo "================================"

          ZIP_FILE=$(find . -type f -iname "*.zip" -not -path "./extracted/*" | head -n 1)

          if [ -z "$ZIP_FILE" ]; then
            echo "HATA: ZIP dosyası bulunamadı!"
            echo ""
            echo "Mevcut dosyalar:"
            find . -maxdepth 3 -type f | head -n 200
            exit 1
          fi

          echo "ZIP bulundu:"
          echo "$ZIP_FILE"

          rm -rf extracted
          mkdir -p extracted

          echo ""
          echo "ZIP Python ile açılıyor..."

          python3 - "$ZIP_FILE" <<'PY'
import sys
import zipfile
from pathlib import Path

zip_file = sys.argv[1]
destination = Path("extracted")

print("ZIP:", zip_file)

with zipfile.ZipFile(zip_file, "r") as z:
    bad = z.testzip()

    if bad:
        print("UYARI: ZIP içinde sorunlu dosya:", bad)

    members = z.infolist()

    print("ZIP içindeki dosya sayısı:", len(members))

    for member in members:
        print("Çıkarılıyor:", member.filename)
        z.extract(member, destination)

print("ZIP açma işlemi tamamlandı.")
PY

          echo ""
          echo "================================"
          echo "ÇIKARILAN DOSYALAR"
          echo "================================"

          find extracted -type f | head -n 300

      - name: Gradle projesini bul
        shell: bash
        run: |
          set -e

          echo "================================"
          echo "GRADLE PROJESİ ARANIYOR"
          echo "================================"

          GRADLEW=$(find extracted -type f -name "gradlew" | head -n 1)

          if [ -n "$GRADLEW" ]; then
            PROJECT_DIR=$(dirname "$GRADLEW")

            echo "gradlew bulundu:"
            echo "$GRADLEW"

            echo "Proje klasörü:"
            echo "$PROJECT_DIR"

          else
            echo "gradlew bulunamadı."

            SETTINGS=$(find extracted -type f \( \
              -name "settings.gradle" \
              -o -name "settings.gradle.kts" \
              \) | head -n 1)

            if [ -z "$SETTINGS" ]; then
              echo "HATA: Gradle projesi bulunamadı!"
              echo ""
              echo "Bulunan dosyalar:"
              find extracted -maxdepth 5 -type f | head -n 500
              exit 1
            fi

            PROJECT_DIR=$(dirname "$SETTINGS")

            echo "settings dosyası bulundu:"
            echo "$SETTINGS"

            echo "Proje klasörü:"
            echo "$PROJECT_DIR"
          fi

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Gradle wrapper hazırla
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          if [ ! -f "./gradlew" ]; then
            echo "HATA: gradlew bulunamadı!"
            echo "Proje klasörü:"
            pwd
            find . -maxdepth 3 -type f | head -n 200
            exit 1
          fi

          chmod +x ./gradlew

          echo "Gradle sürümü:"
          ./gradlew --version

      - name: APK oluştur
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          echo "================================"
          echo "APK OLUŞTURULUYOR"
          echo "================================"

          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: APK dosyasını kontrol et
        shell: bash
        run: |
          set -e

          echo "================================"
          echo "APK ARANIYOR"
          echo "================================"

          find "$PROJECT_DIR" -type f -iname "*.apk" -print

          APK_COUNT=$(find "$PROJECT_DIR" -type f -iname "*.apk" | wc -l)

          if [ "$APK_COUNT" -eq 0 ]; then
            echo "HATA: APK bulunamadı!"
            exit 1
          fi

          echo ""
          echo "APK BAŞARIYLA OLUŞTURULDU!"
          echo "APK sayısı: $APK_COUNT"

      - name: APK'yı yükle
        uses: actions/upload-artifact@v4
        with:
          name: donduteyze-apk
          path: |
            **/*.apk
          if-no-files-found: error
          retention-days: 30
