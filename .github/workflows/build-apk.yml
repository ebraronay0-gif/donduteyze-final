name: Dondu Teyze APK Olustur

on:
  workflow_dispatch:

  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Android APK Derlemesi
    runs-on: ubuntu-latest

    steps:

      # --------------------------------------------------
      # 1 - GitHub deposunu indir
      # --------------------------------------------------
      - name: Depoyu indir
        uses: actions/checkout@v5

      # --------------------------------------------------
      # 2 - Java 17
      # --------------------------------------------------
      - name: Java 17 kur
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      # --------------------------------------------------
      # 3 - Android SDK
      # --------------------------------------------------
      - name: Android SDK kur
        uses: android-actions/setup-android@v3

      # --------------------------------------------------
      # 4 - Android SDK paketlerini kur
      # --------------------------------------------------
      - name: Android SDK paketlerini kur
        shell: bash
        run: |
          echo "Android SDK hazirlaniyor..."

          yes | sdkmanager --licenses || true

          sdkmanager "platform-tools"
          sdkmanager "platforms;android-35"
          sdkmanager "build-tools;35.0.0"

          echo "Android SDK hazir."

      # --------------------------------------------------
      # 5 - ZIP dosyasini bul
      # --------------------------------------------------
      - name: ZIP dosyasini bul
        id: zip
        shell: bash
        run: |
          echo "========================================"
          echo "ZIP DOSYASI ARANIYOR"
          echo "========================================"

          ZIP_FILE=$(find . \
            -type f \
            -iname "*.zip" \
            ! -path "./.git/*" \
            | head -n 1)

          if [ -z "$ZIP_FILE" ]; then
            echo ""
            echo "HATA: ZIP dosyasi bulunamadi."
            echo ""
            echo "Depodaki dosyalar:"
            find . -maxdepth 4 -type f | head -200
            exit 1
          fi

          echo ""
          echo "ZIP bulundu:"
          echo "$ZIP_FILE"

          echo "zip_file=$ZIP_FILE" >> "$GITHUB_OUTPUT"

      # --------------------------------------------------
      # 6 - ZIP dosyasini ac
      # --------------------------------------------------
      - name: ZIP dosyasini ac
        shell: bash
        run: |
          echo "========================================"
          echo "ZIP DOSYASI ACILIYOR"
          echo "========================================"

          rm -rf extracted
          mkdir -p extracted

          unzip -o "${{ steps.zip.outputs.zip_file }}" -d extracted

          echo ""
          echo "ZIP basariyla acildi."

          echo ""
          echo "ZIP ICERIGI:"
          find extracted -maxdepth 5 -type f | head -300

      # --------------------------------------------------
      # 7 - Gradle projesini bul
      # --------------------------------------------------
      - name: Gradle projesini bul
        id: gradle
        shell: bash
        run: |
          echo "========================================"
          echo "GRADLE PROJESI ARANIYOR"
          echo "========================================"

          GRADLEW=$(find extracted \
            -type f \
            -name "gradlew" \
            | head -n 1)

          if [ -n "$GRADLEW" ]; then

            PROJECT_DIR=$(dirname "$GRADLEW")
